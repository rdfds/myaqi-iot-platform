services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myaqi}
      POSTGRES_USER: ${POSTGRES_USER:-myaqi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myaqi-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-myaqi}:${POSTGRES_PASSWORD:-myaqi-local}@postgres:5432/${POSTGRES_DB:-myaqi}
      DEVICE_MASTER_KEY: ${DEVICE_MASTER_KEY:?set DEVICE_MASTER_KEY in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 12

  outbox-worker:
    build: ./backend
    command: ["myaqi-worker"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
