[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "myaqi-backend"
version = "0.1.0"
description = "Reliable ingestion backend for the myAQI IoT platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "boto3>=1.40,<2",
  "Flask>=3.1,<4",
  "gunicorn>=23,<24",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pip-audit>=2.10,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "pyserial>=3.5,<4",
  "PyYAML>=6.0,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
myaqi-admin = "myaqi_backend.admin:main"
myaqi-worker = "myaqi_backend.outbox:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "postgres: requires a PostgreSQL TEST_DATABASE_URL",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["myaqi_backend", "myaqi_client", "tests"]
